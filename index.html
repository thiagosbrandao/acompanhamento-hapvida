<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Minhas carências • Plano de saúde</title><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#141f31;--panel2:#19273b;--line:#2a3b52;--txt:#f4f7fc;--muted:#b4c1d3;--blue:#6ca9ff;--green:#67dbad;--amber:#ffd18a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -10%,#1c3555 0,transparent 48%),var(--bg);color:var(--txt);font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5}.wrap{max-width:850px;margin:auto;padding:28px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:32px}.brand{font-weight:800;font-size:21px;letter-spacing:-.6px}.brand span{color:var(--blue)}.pill{background:#1c3049;border:1px solid #365272;border-radius:100px;color:#c5ddff;padding:7px 13px;font-size:13px;font-weight:700}h1{font-size:clamp(31px,6vw,48px);letter-spacing:-1.5px;line-height:1.08;margin:0 0 14px}h2{font-size:23px;letter-spacing:-.5px;margin:0 0 18px}.lead{font-size:17px;color:var(--muted);margin:0 0 26px}.hero{background:linear-gradient(130deg,#1c3452,#15253a 65%,#142034);border:1px solid #3a5573;border-radius:23px;padding:27px;margin:24px 0;box-shadow:0 16px 35px #0003}.eyebrow{font-size:13px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;color:#b5d3ff}.hero h2{font-size:clamp(25px,5vw,34px);margin:9px 0 6px}.hero .date{color:#d3e3f8;font-size:17px}.count{display:flex;align-items:baseline;gap:11px;margin:22px 0 12px}.count strong{font-size:clamp(49px,11vw,76px);letter-spacing:-4px;line-height:1;font-variant-numeric:tabular-nums}.count span{font-size:18px;color:#d5e3f5}.track{height:11px;border-radius:20px;background:#34465b;overflow:hidden;margin:19px 0 12px}.fill{height:100%;background:linear-gradient(90deg,#5a91ed,#83c9ff);border-radius:20px;transition:width .8s ease}.hero-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#c9d9ec;font-size:15px}.section{margin-top:39px}.timeline{display:grid;gap:13px}.item{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;transition:background .2s,border-color .2s}.item:hover{background:var(--panel2);border-color:#49617e}.symbol{width:43px;height:43px;display:grid;place-items:center;border-radius:13px;background:#233750;color:#9bc8ff;font-size:21px;font-weight:800}.item.done .symbol{background:#193f38;color:var(--green)}.item-head{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap}.item h3{font-size:19px;letter-spacing:-.35px;margin:0 0 4px}.status{font-size:13px;font-weight:800;color:#9bc8ff;background:#203b5b;padding:5px 10px;border-radius:20px;white-space:nowrap}.done .status{background:#194239;color:var(--green)}.item p{color:#d0d9e8;font-size:16px;margin:8px 0}.meta{font-size:15px;color:var(--muted);margin-top:9px}.settings{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#111e30;border:1px solid var(--line);padding:18px 20px;border-radius:16px;margin-top:25px}.settings label{font-weight:700;font-size:16px}.settings small{display:block;font-size:13px;color:var(--muted);font-weight:400}input[type=date]{font:inherit;font-size:16px;background:#263951;color:white;border:1px solid #56708d;padding:10px 12px;border-radius:10px;color-scheme:dark;max-width:100%}details{background:#141f31;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:12px}summary{cursor:pointer;font-size:17px;font-weight:750}details p{font-size:15px;color:#cbd7e8;margin-bottom:0}footer{font-size:13px;color:#96a8be;margin-top:32px}.empty{color:var(--green);font-size:21px;font-weight:800}@media(max-width:480px){.wrap{padding:22px 15px 50px}.hero{padding:22px 20px}.item{padding:17px 14px;grid-template-columns:37px 1fr;gap:11px}.symbol{width:37px;height:37px}.item h3{font-size:18px}.top{margin-bottom:27px}.pill{font-size:12px}.brand{font-size:18px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">meu<span>plano.</span></div><div class="pill">Hapvida · Acompanhamento</div></header><h1>Suas carências,<br>sem complicação.</h1><p class="lead">Veja quando cada cobertura estará disponível e acompanhe o tempo que falta.</p><section class="hero" aria-live="polite"><div class="eyebrow">Próxima liberação</div><div id="next"></div></section><section class="section"><h2>Calendário de liberações</h2><div class="timeline" id="timeline"></div></section></main><script>
const rules=[{n:'Urgência e emergência',days:1,display:'24 horas',desc:'Atendimento de urgência e emergência, conforme as regras de cobertura.'},{n:'Consultas e exames básicos',days:30,display:'30 dias',desc:'Consultas eletivas, exames laboratoriais e raio-X simples.'},{n:'Exames de imagem e coração',days:90,display:'90 dias',desc:'Ultrassonografia, ecocardiograma e teste ergométrico.'},{n:'Procedimentos e internações',days:180,display:'180 dias',desc:'Fisioterapia, endoscopia, sessões multidisciplinares, densitometria, internações, quimioterapia e tomografia.'},{n:'Parto a termo',days:300,display:'300 dias',desc:'Prazo geral para parto a termo. Confira a exceção para titular indicada no aviso.'},{n:'Doenças ou lesões preexistentes',months:24,display:'24 meses',desc:'Possível cobertura parcial temporária, conforme declaração de saúde e contrato.'}];
const dateFmt=new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'long',year:'numeric'});const dayMs=86400000;function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))}function add(base,r){const d=new Date(base);if(r.months){d.setUTCFullYear(d.getUTCFullYear()+2)}else d.setUTCDate(d.getUTCDate()+r.days);return d}function today(){const d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())}function diff(d){return Math.max(0,Math.ceil((d.getTime()-today())/dayMs))}function render(){const base=parse('2026-10-01');const all=rules.map(r=>({...r,end:add(base,r)}));const next=all.find(r=>diff(r.end)>0);const box=document.getElementById('next');if(next){const remaining=diff(next.end),total=Math.max(1,Math.round((next.end-base)/dayMs)),pct=Math.min(100,Math.max(0,((total-remaining)/total)*100));box.innerHTML=`<h2>${next.n}</h2><div class="date">Liberação prevista: ${dateFmt.format(next.end)}</div><div class="count"><strong>${remaining}</strong><span>${remaining===1?'dia restante':'dias restantes'}</span></div><div class="track" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:${pct}%"></div></div><div class="hero-foot"><span>${Math.round(pct)}% do prazo transcorrido</span><span>Carência de ${next.display}</span></div>`}else box.innerHTML='<h2 class="empty">Todos os prazos concluídos ✓</h2><p>As datas previstas de carência já passaram. Confirme a cobertura contratual com a operadora.</p>';document.getElementById('timeline').innerHTML=all.map((r,i)=>{const left=diff(r.end),done=left===0;return `<article class="item ${done?'done':''}"><div class="symbol">${done?'✓':String(i+1).padStart(2,'0')}</div><div><div class="item-head"><h3>${r.n}</h3><span class="status">${done?'Prazo concluído':left+' dias restantes'}</span></div><p>${r.desc}</p><div class="meta">${r.display} · ${dateFmt.format(r.end)}</div></div></article>`}).join('')};render();
</script></body></html>
